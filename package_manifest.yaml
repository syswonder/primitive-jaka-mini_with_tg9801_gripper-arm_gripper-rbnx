manifestVersion: 1

build: bash scripts/build.sh

start: bash scripts/start.sh

package:
  name: "robonix.primitive.jaka.mini.arm_gripper"
  version: 0.1.0
  description: "JAKA 6-DOF arm + TG-9801 gripper primitive (jkrc SDK over TCP)."
  tags:
    - primitive
    - arm
    - jaka
    - robonix
  maintainers:
    - Felix <xi.lifeng@qq.com>
  license: Apache-2.0

capabilities:
  - name: robonix/primitive/arm/joint_states
    transport: ros2
  - name: robonix/primitive/arm/joint_command
    transport: ros2
  - name: robonix/primitive/arm/pos_command
    transport: ros2
  - name: robonix/primitive/arm/end_pose
    transport: ros2
  - name: robonix/primitive/gripper/state
    transport: ros2
  - name: robonix/primitive/gripper/info
    transport: ros2
  - name: robonix/primitive/gripper/grip
    transport: ros2
  - name: robonix/primitive/gripper/open
    transport: ros2

depends: []
